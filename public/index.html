<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Study Notes</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0f1115" />
<style>
  :root { --bg:#0f1115; --panel:#181b22; --text:#e8eaf0; --muted:#8a90a0; --accent:#4f8cff; --me:#2a3550; --line:#232733; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; height:100dvh; display:flex; overflow:hidden; }
  aside { width:260px; background:#12151b; border-right:1px solid var(--line); display:flex; flex-direction:column; transition:transform .2s; }
  aside .top { padding:12px; }
  aside .top button { width:100%; background:var(--accent); color:#fff; border:0; border-radius:10px; padding:10px; font-weight:600; cursor:pointer; }
  #list { flex:1; overflow-y:auto; padding:0 8px 12px; }
  .item { display:flex; align-items:center; gap:6px; padding:9px 10px; border-radius:8px; cursor:pointer; color:var(--muted); font-size:14px; }
  .item:hover, .item.on { background:var(--panel); color:var(--text); }
  .item span { flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .item b { opacity:0; font-weight:400; padding:0 4px; }
  .item:hover b { opacity:.7; }
  main { flex:1; display:flex; flex-direction:column; min-width:0; }
  header { padding:12px 16px; font-weight:600; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:center; }
  #menu { display:none; background:none; border:1px solid #333; color:var(--text); border-radius:8px; padding:4px 10px; cursor:pointer; font-size:16px; }
  #chat { flex:1; overflow-y:auto; padding:16px; }
  .wrap { max-width:800px; margin:0 auto; display:flex; flex-direction:column; gap:12px; }
  .msg { padding:10px 14px; border-radius:14px; max-width:85%; white-space:pre-wrap; line-height:1.5; word-wrap:break-word; }
  .user { background:var(--me); align-self:flex-end; }
  .bot { background:var(--panel); align-self:flex-start; }
  .err { color:#ff7b7b; }
  form { display:flex; gap:8px; padding:12px 16px; max-width:800px; width:100%; margin:0 auto; }
  textarea { flex:1; resize:none; background:var(--panel); color:var(--text); border:1px solid #2a2e38; border-radius:12px; padding:12px; font:inherit; }
  form button { background:var(--accent); color:#fff; border:0; border-radius:12px; padding:0 18px; font-weight:600; cursor:pointer; }
  form button:disabled { opacity:.5; }
  .empty { color:var(--muted); text-align:center; margin-top:30vh; }
  #shade { display:none; }
  @media (max-width: 700px) {
    aside { position:fixed; inset:0 auto 0 0; z-index:10; transform:translateX(-100%); }
    body.open aside { transform:none; }
    body.open #shade { display:block; position:fixed; inset:0; background:#0008; z-index:5; }
    #menu { display:block; }
  }
</style>
</head>
<body>
<aside>
  <div class="top"><button id="new">+ New chat</button></div>
  <div id="list"></div>
</aside>
<div id="shade"></div>
<main>
  <header><button id="menu">☰</button><span id="title">Study Notes</span></header>
  <div id="chat"><div class="wrap" id="wrap"></div></div>
  <form id="f">
    <textarea id="q" rows="1" placeholder="Type a message..." required></textarea>
    <button id="send">Send</button>
  </form>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const chatBox = $("chat"), wrap = $("wrap"), q = $("q"), send = $("send"), list = $("list");

  // ---- storage (saved in this browser only) ----
  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  let chats = load("chats", []);          // [{id, title, messages}]
  let currentId = load("current", null);
  let pw = load("pw", "");

  const current = () => chats.find((c) => c.id === currentId);
  function persist() { save("chats", chats); save("current", currentId); }

  function newChat() {
    const c = { id: Date.now().toString(36), title: "New chat", messages: [] };
    chats.unshift(c); currentId = c.id; persist(); render();
  }

  function renderList() {
    list.innerHTML = "";
    for (const c of chats) {
      const d = document.createElement("div");
      d.className = "item" + (c.id === currentId ? " on" : "");
      d.innerHTML = "<span></span><b title='Delete'>✕</b>";
      d.querySelector("span").textContent = c.title;
      d.onclick = () => { currentId = c.id; persist(); render(); document.body.classList.remove("open"); };
      d.querySelector("b").onclick = (e) => {
        e.stopPropagation();
        if (!confirm("Delete this chat?")) return;
        chats = chats.filter((x) => x.id !== c.id);
        if (currentId === c.id) currentId = chats[0]?.id || null;
        persist(); if (!currentId) newChat(); else render();
      };
      list.appendChild(d);
    }
  }

  function add(text, cls) {
    const e = wrap.querySelector(".empty"); if (e) e.remove();
    const d = document.createElement("div");
    d.className = "msg " + cls; d.textContent = text;
    wrap.appendChild(d); chatBox.scrollTop = chatBox.scrollHeight;
    return d;
  }

  function render() {
    renderList();
    const c = current();
    $("title").textContent = c && c.messages.length ? c.title : "Study Notes";
    wrap.innerHTML = "";
    if (!c || !c.messages.length) { wrap.innerHTML = '<div class="empty">Ask me anything.</div>'; return; }
    for (const m of c.messages) add(m.content, m.role === "user" ? "user" : "bot");
  }

  async function ask() {
    const text = q.value.trim(); if (!text) return;
    const c = current();
    q.value = ""; add(text, "user");
    c.messages.push({ role: "user", content: text });
    if (c.title === "New chat") c.title = text.slice(0, 40);
    persist(); renderList(); $("title").textContent = c.title;

    send.disabled = true;
    const box = add("...", "bot");
    try {
      const r = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-site-password": pw },
        body: JSON.stringify({ messages: c.messages }),
      });
      if (r.status === 401) {
        pw = prompt("Password:") || ""; save("pw", pw);
        c.messages.pop(); persist(); box.remove(); wrap.lastChild?.remove();
        q.value = text; send.disabled = false; return;
      }
      if (!r.ok) { const d = await r.json().catch(() => ({})); throw new Error(d.error || "Error"); }

      // read the reply as it streams in
      const reader = r.body.getReader(), dec = new TextDecoder();
      let reply = ""; box.textContent = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        reply += dec.decode(value, { stream: true });
        box.textContent = reply;
        chatBox.scrollTop = chatBox.scrollHeight;
      }
      if (!reply) throw new Error("No reply, try again");
      c.messages.push({ role: "assistant", content: reply });
      persist();
    } catch (e) {
      box.textContent = e.message; box.classList.add("err");
      c.messages.pop(); persist();
    }
    send.disabled = false; q.focus();
  }

  $("f").onsubmit = (e) => { e.preventDefault(); ask(); };
  q.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); } });
  $("new").onclick = () => { newChat(); document.body.classList.remove("open"); };
  $("menu").onclick = () => document.body.classList.add("open");
  $("shade").onclick = () => document.body.classList.remove("open");

  if (!current()) newChat(); else render();
</script>
</body>
</html>
