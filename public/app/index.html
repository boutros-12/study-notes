<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
<title>Cedar</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0f1115" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
  :root { --bg:#0f1115; --side:#12151b; --panel:#181b22; --panel2:#1f2330; --text:#e8eaf0; --muted:#8a90a0; --accent:#4f8cff; --me:#2a3550; --line:#232733; --err:#ff7b7b; }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; display:flex; overflow:hidden; height:100dvh; }
  button { font:inherit; }

  /* Sidebar */
  aside { width:260px; flex-shrink:0; background:var(--side); border-right:1px solid var(--line); display:flex; flex-direction:column; transition:transform .2s; }
  aside .top { padding:12px; }
  .newbtn { width:100%; background:var(--accent); color:#fff; border:0; border-radius:10px; padding:10px; font-weight:600; cursor:pointer; }
  #list { flex:1; overflow-y:auto; padding:0 8px 12px; }
  .item { display:flex; align-items:center; gap:6px; padding:9px 10px; border-radius:8px; cursor:pointer; color:var(--muted); font-size:14px; }
  .item:hover, .item.on { background:var(--panel); color:var(--text); }
  .item span { flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .item b { opacity:0; font-weight:400; padding:0 4px; }
  .item:hover b, .item.on b { opacity:.7; }
  .syncbar { margin:8px; background:var(--panel); border:1px solid var(--line); color:var(--muted); border-radius:10px; padding:9px 10px; text-align:left; cursor:pointer; font-size:13px; }
  .syncbar:hover { color:var(--text); }
  .syncbar.on { color:#7ee2a8; }
  .syncbar.bad { color:var(--err); }

  /* Main */
  main { flex:1; display:flex; flex-direction:column; min-width:0; }
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:center; }
  header .title { font-weight:600; flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  #menu { display:none; background:none; border:1px solid #333; color:var(--text); border-radius:8px; padding:4px 10px; cursor:pointer; font-size:16px; }
  .modes { display:flex; background:var(--panel); border-radius:10px; padding:3px; gap:2px; flex-shrink:0; }
  .modes button { background:none; border:0; color:var(--muted); padding:6px 10px; border-radius:8px; cursor:pointer; font-size:13px; }
  .modes button.on { background:var(--panel2); color:var(--text); }

  #chat { flex:1; overflow-y:auto; padding:20px 16px; }
  .wrap { max-width:820px; margin:0 auto; display:flex; flex-direction:column; gap:18px; }
  .msg { line-height:1.6; word-wrap:break-word; overflow-wrap:anywhere; }
  .user { align-self:flex-end; background:var(--me); padding:10px 14px; border-radius:16px; max-width:85%; white-space:pre-wrap; }
  .user .file { display:inline-block; font-size:12px; background:#0003; border-radius:6px; padding:2px 8px; margin:0 4px 6px 0; }
  .bot { align-self:stretch; }
  .bot.err { color:var(--err); }
  .thinking { color:var(--muted); font-style:italic; }

  /* Markdown */
  .md > :first-child { margin-top:0; } .md > :last-child { margin-bottom:0; }
  .md h1, .md h2, .md h3 { line-height:1.3; margin:1.1em 0 .5em; } .md h1 { font-size:1.4em; } .md h2 { font-size:1.2em; } .md h3 { font-size:1.05em; }
  .md p { margin:.6em 0; } .md ul, .md ol { padding-left:1.4em; margin:.5em 0; } .md li { margin:.2em 0; }
  .md a { color:var(--accent); }
  .md code { background:var(--panel2); padding:.15em .4em; border-radius:5px; font-size:.9em; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .md pre { position:relative; background:#0b0d12 !important; border:1px solid var(--line); border-radius:10px; padding:0; margin:.8em 0; overflow:hidden; }
  .md pre .bar { display:flex; justify-content:space-between; align-items:center; padding:6px 10px; background:var(--panel); font-size:12px; color:var(--muted); }
  .md pre .bar button { background:none; border:1px solid #333; color:var(--muted); border-radius:6px; padding:2px 8px; cursor:pointer; font-size:12px; }
  .md pre code { display:block; padding:12px 14px; overflow-x:auto; background:none; font-size:13px; line-height:1.5; }
  .md table { border-collapse:collapse; display:block; overflow-x:auto; margin:.8em 0; }
  .md th, .md td { border:1px solid var(--line); padding:6px 10px; text-align:left; } .md th { background:var(--panel); }
  .md blockquote { border-left:3px solid var(--line); margin:.6em 0; padding-left:12px; color:var(--muted); }
  .actions { display:flex; gap:6px; margin-top:8px; }
  .actions button { background:none; border:1px solid var(--line); color:var(--muted); border-radius:6px; padding:3px 9px; cursor:pointer; font-size:12px; }
  .actions button:hover { color:var(--text); }
  .actions .model { margin-left:auto; color:var(--muted); font-size:11px; align-self:center; opacity:.8; }

  /* Welcome */
  .welcome { text-align:center; margin-top:12vh; }
  .welcome h1 { font-size:26px; margin:0 0 6px; }
  .welcome p { color:var(--muted); margin:0 0 22px; }
  .starters { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; text-align:left; }
  .starters button { background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:12px; padding:12px; cursor:pointer; font-size:14px; text-align:left; }
  .starters button:hover { border-color:var(--accent); }

  /* Composer */
  .composer { max-width:820px; width:100%; margin:0 auto; padding:10px 16px 14px; }
  #files { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px; }
  .chip { background:var(--panel2); border-radius:8px; padding:4px 8px; font-size:12px; display:flex; gap:6px; align-items:center; }
  .chip b { cursor:pointer; font-weight:400; opacity:.7; }
  .chip img { width:34px; height:34px; object-fit:cover; border-radius:5px; }
  .user .pics { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px; }
  .user .pics img { max-width:180px; max-height:180px; border-radius:10px; display:block; cursor:zoom-in; }
  form { display:flex; gap:8px; align-items:flex-end; background:var(--panel); border:1px solid #2a2e38; border-radius:14px; padding:8px; }
  form:focus-within { border-color:#3a4256; }
  textarea { flex:1; resize:none; background:none; color:var(--text); border:0; outline:none; padding:6px 4px; font:inherit; max-height:200px; line-height:1.5; }
  .icon { background:none; border:0; color:var(--muted); font-size:20px; cursor:pointer; padding:4px 6px; border-radius:8px; }
  .icon:hover { color:var(--text); }
  #send { background:var(--accent); color:#fff; border:0; border-radius:10px; padding:8px 16px; font-weight:600; cursor:pointer; }
  #send.stop { background:#3a3f4d; }
  .hint { text-align:center; color:var(--muted); font-size:11px; margin-top:6px; }

  #shade { display:none; }
  @media (max-width: 760px) {
    aside { position:fixed; inset:0 auto 0 0; z-index:10; transform:translateX(-100%); }
    body.open aside { transform:none; }
    body.open #shade { display:block; position:fixed; inset:0; background:#0008; z-index:5; }
    #menu { display:block; }
    header .title { display:none; }
    header { justify-content:space-between; }
  }
</style>
</head>
<body>
<aside>
  <div class="top"><button class="newbtn" id="new">+ New chat</button></div>
  <div id="list"></div>
  <button class="syncbar" id="syncbtn" title="Sync chats across your devices">☁️ Sync: off</button>
</aside>
<div id="shade"></div>
<main>
  <header>
    <button id="menu" aria-label="Menu">☰</button>
    <span class="title" id="title">Cedar</span>
    <div class="modes" id="modes">
      <button data-mode="smart" title="Strongest model, thinks before answering">🧠 Smart</button>
      <button data-mode="web" title="Searches the internet for current info">🌐 Web</button>
      <button data-mode="fast" title="Quick answers">⚡ Fast</button>
      <button data-mode="claude" title="Claude (paid, uses your Anthropic credit)">🟣 Claude</button>
    </div>
  </header>
  <div id="chat"><div class="wrap" id="wrap"></div></div>
  <div class="composer">
    <div id="files"></div>
    <form id="f">
      <button type="button" class="icon" id="attach" title="Attach pictures, PDF, Word, Excel, PowerPoint, code or text (or paste a screenshot)">📎</button>
      <input type="file" id="picker" multiple hidden />
      <textarea id="q" rows="1" placeholder="Ask anything, or paste a screenshot..."></textarea>
      <button id="send" type="submit">Send</button>
    </form>
    <div class="hint">Enter to send · Shift+Enter for new line · AI can make mistakes</div>
  </div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const chatBox = $("chat"), wrap = $("wrap"), q = $("q"), sendBtn = $("send"), list = $("list");

  // ---------- storage (this browser only) ----------
  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  let chats = load("chats", []);
  let currentId = load("current", null);
  let mode = load("mode", "smart");
  let pw = load("pw", "");
  let pending = [];        // attached: {name, text} or {name, image, thumb}
  const fullImages = new Map(); // message id -> full-size pictures (kept in memory only)
  let controller = null;   // for the Stop button

  const current = () => chats.find((c) => c.id === currentId);
  let deleted = load("deleted", {});   // chat id -> time deleted (so deletes sync too)
  const persist = (changed) => {
    if (changed) changed.updatedAt = Date.now();
    save("chats", chats); save("current", currentId); save("deleted", deleted);
    if (changed || persist.force) scheduleSync();
  };

  // ---------- markdown ----------
  const hasMd = typeof marked !== "undefined" && typeof DOMPurify !== "undefined";
  if (hasMd) marked.setOptions({ gfm: true, breaks: false });
  function renderMd(el, text) {
    if (!hasMd) { el.textContent = text; return; }
    el.innerHTML = DOMPurify.sanitize(marked.parse(text));
    el.querySelectorAll("a").forEach((a) => { a.target = "_blank"; a.rel = "noopener"; });
    el.querySelectorAll("pre > code").forEach((code) => {
      if (window.hljs) { try { hljs.highlightElement(code); } catch {} }
      const lang = (code.className.match(/language-([\w+-]+)/) || [])[1] || "code";
      const bar = document.createElement("div");
      bar.className = "bar";
      bar.innerHTML = "<span></span><button>Copy</button>";
      bar.querySelector("span").textContent = lang;
      bar.querySelector("button").onclick = (e) => copy(code.innerText, e.target);
      code.parentElement.prepend(bar);
    });
  }
  function copy(text, btn) {
    navigator.clipboard?.writeText(text).then(() => {
      const old = btn.textContent; btn.textContent = "Copied ✓"; setTimeout(() => (btn.textContent = old), 1200);
    });
  }

  // ---------- modes ----------
  function setMode(m) {
    mode = m; save("mode", m);
    document.querySelectorAll("#modes button").forEach((b) => b.classList.toggle("on", b.dataset.mode === m));
  }
  document.querySelectorAll("#modes button").forEach((b) => (b.onclick = () => setMode(b.dataset.mode)));
  setMode(mode);

  // ---------- chats ----------
  function newChat() {
    const c = { id: Date.now().toString(36), title: "New chat", messages: [] };
    chats.unshift(c); currentId = c.id; persist(); render();
  }

  function renderList() {
    list.innerHTML = "";
    for (const c of chats) {
      const d = document.createElement("div");
      d.className = "item" + (c.id === currentId ? " on" : "");
      d.innerHTML = "<span></span><b title='Delete'>✕</b>";
      d.querySelector("span").textContent = c.title;
      d.onclick = () => { if (controller) return; currentId = c.id; persist(); render(); document.body.classList.remove("open"); };
      d.querySelector("b").onclick = (e) => {
        e.stopPropagation();
        if (controller || !confirm("Delete this chat?")) return;
        chats = chats.filter((x) => x.id !== c.id);
        deleted[c.id] = Date.now();
        if (currentId === c.id) currentId = chats[0]?.id || null;
        persist.force = true; persist(); persist.force = false;
        if (!currentId) newChat(); else render();
      };
      list.appendChild(d);
    }
  }

  const STARTERS = [
    "Explain how an AI agent works (the agent loop) with a simple diagram",
    "Build a Python agent with tool calling that can search and do math",
    "Compare LangGraph, CrewAI and AutoGen in a table",
    "What is MCP (Model Context Protocol) and how do I build a server?",
    "How do prompt injection attacks work on AI agents, and how do I defend?",
    "Design a multi-agent system for threat intelligence (CTI)",
  ];

  function welcome() {
    wrap.innerHTML = `<div class="welcome"><h1>What can I help with?</h1><p>Coding, agentic AI, cybersecurity, studying — anything.</p><div class="starters"></div></div>`;
    const box = wrap.querySelector(".starters");
    for (const s of STARTERS) {
      const b = document.createElement("button"); b.textContent = s;
      b.onclick = () => { q.value = s; ask(); };
      box.appendChild(b);
    }
  }

  function addUser(m) {
    wrap.querySelector(".welcome")?.remove();
    const d = document.createElement("div"); d.className = "msg user";
    if (m.images?.length) {
      const box = document.createElement("div"); box.className = "pics";
      const big = fullImages.get(m.id) || [];
      m.images.forEach((src, i) => {
        const img = document.createElement("img"); img.src = src; img.alt = "picture";
        img.onclick = () => { const w = window.open(); if (w) w.document.write(`<body style="margin:0;background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh"><img src="${big[i] || src}" style="max-width:100%;max-height:100vh">`); };
        box.appendChild(img);
      });
      d.appendChild(box);
    }
    for (const f of m.files || []) { const s = document.createElement("span"); s.className = "file"; s.textContent = "📄 " + f; d.appendChild(s); }
    if (m.files?.length) d.appendChild(document.createElement("br"));
    d.appendChild(document.createTextNode(m.shown ?? m.content));
    wrap.appendChild(d);
    return d;
  }

  function addBot(text, { isLast = false, model = "" } = {}) {
    wrap.querySelector(".welcome")?.remove();
    const d = document.createElement("div"); d.className = "msg bot";
    const body = document.createElement("div"); body.className = "md"; d.appendChild(body);
    if (text) { renderMd(body, text); addActions(d, text, isLast, model); }
    wrap.appendChild(d);
    return d;
  }

  function addActions(d, text, isLast, model) {
    d.querySelector(".actions")?.remove();
    const a = document.createElement("div"); a.className = "actions";
    const c = document.createElement("button"); c.textContent = "Copy"; c.onclick = () => copy(text, c); a.appendChild(c);
    if (isLast) { const r = document.createElement("button"); r.textContent = "↻ Regenerate"; r.onclick = regenerate; a.appendChild(r); }
    if (model) { const t = document.createElement("span"); t.className = "model"; t.textContent = model; a.appendChild(t); }
    d.appendChild(a);
  }

  function render() {
    renderList();
    const c = current();
    $("title").textContent = c && c.messages.length ? c.title : "Cedar";
    wrap.innerHTML = "";
    if (!c || !c.messages.length) return welcome();
    c.messages.forEach((m, i) => m.role === "user" ? addUser(m) : addBot(m.content, { isLast: i === c.messages.length - 1, model: m.model }));
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  // ---------- files ----------
  $("attach").onclick = () => $("picker").click();
  $("picker").onchange = (e) => { addFiles(e.target.files); e.target.value = ""; };

  const ext = (n) => (n.split(".").pop() || "").toLowerCase();
  const IMG = ["png", "jpg", "jpeg", "webp", "gif", "bmp", "heic", "heif", "avif"];

  async function addFiles(list) {
    for (const file of list) {
      const e = ext(file.name || "");
      try {
        if (file.type.startsWith("image/") || IMG.includes(e)) {
          if (pending.filter((p) => p.image).length >= 3) { alert("Max 3 pictures per message."); continue; }
          const { full, thumb } = await shrinkImage(file);
          pending.push({ name: file.name || "screenshot.png", image: full, thumb });
          showFiles(); continue;
        }
        if (file.size > 25 * 1024 * 1024) { alert(file.name + " is too big (max 25 MB)"); continue; }
        let text;
        if (e === "pdf") text = await readPdf(file);
        else if (e === "docx") text = await readDocx(file);
        else if (["xlsx", "xls", "xlsm", "ods"].includes(e)) text = await readSheet(file);
        else if (e === "pptx") text = await readPptx(file);
        else if (["doc", "ppt"].includes(e)) { alert(`Old .${e} files can't be read. Open it and "Save as" .${e}x, then attach again.`); continue; }
        else {
          text = await file.text();
          if (text.slice(0, 2000).includes("\u0000")) { alert(file.name + ": this file type can't be read. Try PDF, Word, Excel, PowerPoint, a picture, or a text/code file."); continue; }
        }
        if (!text.trim()) { alert(file.name + " looks empty (if it's a scanned PDF, send a screenshot of the page instead)."); continue; }
        pending.push({ name: file.name, text: text.slice(0, 60000) });
      } catch (err) { alert("Could not read " + (file.name || "file") + (err?.message ? ": " + err.message : "")); }
    }
    showFiles();
  }

  function showFiles() {
    $("files").innerHTML = "";
    pending.forEach((f, i) => {
      const c = document.createElement("div"); c.className = "chip";
      if (f.image) { const im = document.createElement("img"); im.src = f.thumb; c.appendChild(im); }
      const sp = document.createElement("span"); sp.textContent = (f.image ? "" : "📄 ") + f.name; c.appendChild(sp);
      const x = document.createElement("b"); x.textContent = "✕"; x.onclick = () => { pending.splice(i, 1); showFiles(); }; c.appendChild(x);
      $("files").appendChild(c);
    });
  }

  // Resize pictures so they upload fast: full (max 1600px) for the AI, small thumb for history
  function loadImg(file) {
    return new Promise((ok, bad) => {
      const url = URL.createObjectURL(file);
      const im = new Image();
      im.onload = () => { ok(im); setTimeout(() => URL.revokeObjectURL(url), 1000); };
      im.onerror = () => bad(new Error("this picture format isn't supported by your browser (try JPG or PNG)"));
      im.src = url;
    });
  }
  function draw(im, max, q) {
    const k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
    const cv = document.createElement("canvas");
    cv.width = Math.max(1, Math.round(im.naturalWidth * k)); cv.height = Math.max(1, Math.round(im.naturalHeight * k));
    const ctx = cv.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(im, 0, 0, cv.width, cv.height);
    return cv.toDataURL("image/jpeg", q);
  }
  async function shrinkImage(file) {
    const im = await loadImg(file);
    return { full: draw(im, 1600, 0.85), thumb: draw(im, 240, 0.7) };
  }

  // Load a library from the CDN only when needed
  const libs = {};
  function lib(src) {
    return libs[src] || (libs[src] = new Promise((ok, bad) => {
      const sc = document.createElement("script"); sc.src = src; sc.onload = ok; sc.onerror = () => bad(new Error("could not load reader")); document.head.appendChild(sc);
    }));
  }
  async function readDocx(file) {
    await lib("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js");
    const r = await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
    return r.value;
  }
  async function readSheet(file) {
    await lib("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
    const wb = XLSX.read(await file.arrayBuffer(), { type: "array" });
    return wb.SheetNames.map((n) => `[Sheet: ${n}]\n` + XLSX.utils.sheet_to_csv(wb.Sheets[n])).join("\n\n");
  }
  async function readPptx(file) {
    await lib("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js");
    const zip = await JSZip.loadAsync(await file.arrayBuffer());
    const slides = Object.keys(zip.files).filter((f) => /^ppt\/slides\/slide\d+\.xml$/.test(f))
      .sort((a, b) => parseInt(a.match(/\d+/)[0]) - parseInt(b.match(/\d+/)[0]));
    let out = "";
    for (const [i, f] of slides.entries()) {
      const xml = await zip.file(f).async("string");
      const parts = [...xml.matchAll(/<a:t>([^<]*)<\/a:t>/g)].map((m) => m[1]);
      const tmp = document.createElement("textarea"); tmp.innerHTML = parts.join(" ");
      out += `\n[Slide ${i + 1}]\n` + tmp.value;
    }
    return out;
  }

  // Paste screenshots straight into the chat (Ctrl+V)
  document.addEventListener("paste", (e) => {
    const files = [...(e.clipboardData?.items || [])].filter((it) => it.kind === "file").map((it) => it.getAsFile()).filter(Boolean);
    if (files.length) { e.preventDefault(); addFiles(files); }
  });

  let pdfReady = null;
  function loadPdfJs() {
    if (!pdfReady) pdfReady = new Promise((ok, bad) => {
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
      s.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; ok(); };
      s.onerror = bad; document.head.appendChild(s);
    });
    return pdfReady;
  }
  async function readPdf(file) {
    await loadPdfJs();
    const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
    let out = "";
    for (let p = 1; p <= Math.min(pdf.numPages, 60); p++) {
      const page = await pdf.getPage(p);
      const t = await page.getTextContent();
      out += `\n[Page ${p}]\n` + t.items.map((x) => x.str).join(" ");
    }
    return out;
  }

  // ---------- sending ----------
  async function ask() {
    if (controller) return stop();
    const text = q.value.trim();
    if (!text && !pending.length) return;
    const c = current();
    const att = pending; pending = []; showFiles();
    const files = att.filter((f) => !f.image), pics = att.filter((f) => f.image);
    const content = files.map((f) => `File: ${f.name}\n\`\`\`\n${f.text}\n\`\`\``).join("\n\n") + (files.length ? "\n\n" : "") +
      (text || (pics.length && !files.length ? "Look at this picture and help me with it." : "Please look at the attached file(s)."));
    const msg = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), role: "user", content, shown: text, files: files.map((f) => f.name) };
    if (pics.length) { msg.images = pics.map((p) => p.thumb); fullImages.set(msg.id, pics.map((p) => p.image)); }
    q.value = ""; autosize();
    c.messages.push(msg);
    if (c.title === "New chat") c.title = (text || att[0].name).slice(0, 40);
    persist(c); renderList(); $("title").textContent = c.title;
    // remove old regenerate buttons
    wrap.querySelectorAll(".actions button:nth-child(2)").forEach((b) => { if (b.textContent.includes("Regenerate")) b.remove(); });
    addUser(msg);
    await reply(c);
  }

  function buildPayload(c) {
    let left = 3;
    const out = c.messages.map(({ role, content }) => ({ role, content }));
    for (let i = c.messages.length - 1; i >= 0; i--) {
      const m = c.messages[i];
      if (!m.images?.length) continue;
      const big = fullImages.get(m.id);
      if (big && left > 0) { out[i].images = big.slice(0, left); left -= out[i].images.length; }
      else out[i].content += `\n\n[${m.images.length} picture(s) were attached here earlier but are no longer available.]`;
    }
    return out;
  }

  async function reply(c) {
    const box = addBot("");
    const body = box.querySelector(".md");
    body.innerHTML = `<span class="thinking">${mode === "web" ? "Searching the web..." : "Thinking..."}</span>`;
    chatBox.scrollTop = chatBox.scrollHeight;
    controller = new AbortController();
    sendBtn.textContent = "Stop"; sendBtn.classList.add("stop");
    let reply = "", model = "";
    try {
      const r = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-site-password": pw },
        body: JSON.stringify({ mode, messages: buildPayload(c) }),
        signal: controller.signal,
      });
      if (r.status === 401) {
        pw = prompt("Password:") || ""; save("pw", pw);
        box.remove(); done(); return reply(c);
      }
      if (!r.ok) { const d = await r.json().catch(() => ({})); throw new Error(d.error || "Something went wrong"); }
      model = r.headers.get("X-Model") || "";
      const reader = r.body.getReader(), dec = new TextDecoder();
      let last = 0;
      while (true) {
        const { done: end, value } = await reader.read();
        if (end) break;
        reply += dec.decode(value, { stream: true });
        if (Date.now() - last > 60) { // don't re-render too often
          last = Date.now();
          const nearBottom = chatBox.scrollHeight - chatBox.scrollTop - chatBox.clientHeight < 120;
          renderMd(body, reply);
          if (nearBottom) chatBox.scrollTop = chatBox.scrollHeight;
        }
      }
      if (!reply.trim()) throw new Error("No reply. Try again or switch mode.");
    } catch (e) {
      if (e.name !== "AbortError" || !reply) {
        if (e.name === "AbortError") { box.remove(); }
        else { box.classList.add("err"); body.textContent = "⚠️ " + e.message; addRetry(box, c); }
        done(); return;
      }
      reply += "\n\n*(stopped)*";
    }
    renderMd(body, reply);
    c.messages.push({ role: "assistant", content: reply, model });
    persist(c);
    addActions(box, reply, true, model);
    done();
  }

  function addRetry(box, c) {
    const a = document.createElement("div"); a.className = "actions";
    const b = document.createElement("button"); b.textContent = "↻ Try again";
    b.onclick = () => { box.remove(); reply(c); };
    a.appendChild(b); box.appendChild(a);
  }

  function done() {
    controller = null;
    sendBtn.textContent = "Send"; sendBtn.classList.remove("stop");
    q.focus();
  }
  function stop() { controller?.abort(); }

  function regenerate() {
    if (controller) return;
    const c = current();
    if (c.messages.at(-1)?.role !== "assistant") return;
    c.messages.pop(); persist(c);
    [...wrap.querySelectorAll(".msg.bot")].at(-1)?.remove();
    reply(c);
  }

  // ---------- input ----------
  function autosize() { q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 200) + "px"; }
  q.addEventListener("input", autosize);
  q.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing && window.innerWidth > 760) { e.preventDefault(); ask(); }
  });
  $("f").onsubmit = (e) => { e.preventDefault(); ask(); };
  $("new").onclick = () => { if (controller) return; newChat(); document.body.classList.remove("open"); };
  $("menu").onclick = () => document.body.classList.add("open");
  $("shade").onclick = () => document.body.classList.remove("open");

  // drag & drop files
  document.addEventListener("dragover", (e) => e.preventDefault());
  document.addEventListener("drop", (e) => {
    e.preventDefault();
    if (e.dataTransfer?.files?.length) addFiles(e.dataTransfer.files);
  });

  // ---------- sync across devices ----------
  let syncCode = load("syncCode", "");
  let syncTimer = null, syncing = false, lastSync = 0;
  const syncBtn = $("syncbtn");

  function syncStatus(text, cls) {
    syncBtn.textContent = text;
    syncBtn.className = "syncbar" + (cls ? " " + cls : "");
  }

  // Combine two chat lists: newest version of each chat wins, deleted chats stay deleted
  function merge(local, remote, delA, delB) {
    const del = { ...delA };
    for (const [id, t] of Object.entries(delB || {})) del[id] = Math.max(del[id] || 0, t);
    const byId = new Map();
    for (const c of [...remote, ...local]) {
      const old = byId.get(c.id);
      if (!old || (c.updatedAt || 0) > (old.updatedAt || 0)) byId.set(c.id, c);
    }
    const out = [...byId.values()].filter((c) => !(del[c.id] >= (c.updatedAt || 0)));
    out.sort((a, b) => (b.updatedAt || Number.parseInt(b.id, 36) || 0) - (a.updatedAt || Number.parseInt(a.id, 36) || 0));
    // forget very old delete records (60 days)
    const cutoff = Date.now() - 60 * 864e5;
    for (const id in del) if (del[id] < cutoff) delete del[id];
    return { chats: out, deleted: del };
  }

  async function syncNow() {
    if (!syncCode || syncing || controller) return;
    syncing = true;
    try {
      const h = { "x-sync-code": syncCode, "Content-Type": "application/json" };
      const r = await fetch("/api/sync", { headers: h });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || "Sync failed");
      const remote = d.data || { chats: [], deleted: {} };
      const before = JSON.stringify(chats);
      const m = merge(chats, remote.chats || [], deleted, remote.deleted);
      if (controller) return; // a reply started meanwhile; try again later
      chats = m.chats; deleted = m.deleted;
      if (!current()) {
        const empty = { id: Date.now().toString(36), title: "New chat", messages: [] };
        chats.unshift(empty); currentId = empty.id;
      }
      save("chats", chats); save("deleted", deleted); save("current", currentId);
      if (JSON.stringify(chats) !== before) render();
      // upload the merged result (skip empty "New chat" placeholders)
      const toSend = { chats: chats.filter((c) => c.messages.length), deleted };
      const w = await fetch("/api/sync", { method: "PUT", headers: h, body: JSON.stringify({ data: toSend }) });
      const wd = await w.json().catch(() => ({}));
      if (!w.ok) throw new Error(wd.error || "Sync failed");
      lastSync = Date.now();
      syncStatus("☁️ Synced ✓ " + new Date().toTimeString().slice(0, 5), "on");
    } catch (e) {
      syncStatus("⚠️ Sync: " + e.message.slice(0, 40), "bad");
    } finally {
      syncing = false;
    }
  }

  function scheduleSync() {
    if (!syncCode) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(syncNow, 1500);
  }

  syncBtn.onclick = () => {
    if (syncCode) {
      const a = prompt("Sync is ON.\n\nType SYNC to sync now, or OFF to turn sync off on this device.\n(Your chats stay saved in the cloud.)", "SYNC");
      if (!a) return;
      if (a.trim().toUpperCase() === "OFF") { syncCode = ""; save("syncCode", ""); syncStatus("☁️ Sync: off"); return; }
      return syncNow();
    }
    const code = prompt("Choose a private sync code (at least 6 characters).\n\nUse the SAME code on all your devices to see the same chats.\nAnyone with this code can read your chats, so make it hard to guess.");
    if (!code) return;
    if (code.trim().length < 6) return alert("The code must be at least 6 characters.");
    syncCode = code.trim(); save("syncCode", syncCode);
    syncStatus("☁️ Syncing...");
    syncNow();
  };

  // keep devices up to date
  window.addEventListener("focus", () => { if (Date.now() - lastSync > 5000) syncNow(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) syncNow(); });
  setInterval(() => { if (!document.hidden) syncNow(); }, 30000);

  if (!current()) newChat(); else render();
  if (syncCode) { syncStatus("☁️ Syncing..."); syncNow(); }
  q.focus();
</script>
</body>
</html>
